<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таблица служащих — четверги</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0a0f1e 0%, #0a1a2a 100%);
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            padding: 20px;
            color: #f0f0f0;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(15, 25, 45, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 24px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.3);
            overflow-x: auto;
        }
        h1 { color: #ffd966; font-size: clamp(24px, 4vw, 36px); margin-bottom: 20px; text-align: center; letter-spacing: 1px; }
        .header-actions { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
        .back-link { color: #ffd966; text-decoration: none; font-weight: 600; padding: 8px 18px; border: 1px solid #ffd966; border-radius: 40px; transition: 0.2s; }
        .back-link:hover { background: #ffd966; color: #0a0f1e; }
        
        .table-wrap { overflow-x: auto; margin: 16px 0 0; border-radius: 20px; border: 1px solid rgba(255, 217, 102, 0.2); }
        table { width: 100%; border-collapse: collapse; background: rgba(20, 30, 45, 0.6); font-size: 14px; min-width: 700px; }
        th { background: linear-gradient(145deg, #1e2a3a, #0f1a24); color: #ffd966; font-weight: 700; padding: 12px 8px; border: 1px solid rgba(255, 217, 102, 0.25); text-align: center; position: sticky; top: 0; z-index: 10; }
        th:first-child { min-width: 140px; text-align: left; padding-left: 16px; position: sticky; left: 0; z-index: 11; background: #1e2a3a; }
        td { padding: 10px 6px; border: 1px solid rgba(255, 217, 102, 0.15); text-align: center; vertical-align: middle; background: rgba(15, 25, 45, 0.4); }
        td:first-child { font-weight: 600; color: #ffdd99; text-align: left; padding-left: 16px; background: rgba(20, 30, 45, 0.6); border-right: 2px solid rgba(255, 217, 102, 0.3); position: sticky; left: 0; z-index: 5; }
        
        .clickable-header { color: #ffd966 !important; cursor: pointer; text-decoration: underline; text-underline-offset: 4px; transition: 0.2s; }
        .clickable-header:hover { background: rgba(255, 217, 102, 0.1); }

        .cell-free { background: linear-gradient(145deg, #1e7a4a, #0f5e38); color: #fff; font-weight: bold; border-radius: 12px; padding: 6px 4px; display: inline-block; min-width: 40px; cursor: default; }
        .cell-occupied { color: #ccc; padding: 6px 4px; display: inline-block; min-width: 40px; }

        .editable-cell select { background: #0f1a24; color: #fff; border: 2px solid #4a6a8a; border-radius: 12px; padding: 6px 10px; font-size: 14px; font-weight: bold; text-align: center; width: 100%; outline: none; cursor: pointer; }
        .editable-cell select:focus { border-color: #ffd966; }
        .editable-cell select option { background: #1a2a3a; color: #fff; }
        
        .status-P { color: #4CAF50; font-weight: bold; }
        .status-O { color: #f44336; font-weight: bold; }
        .status-U { color: #ff9800; font-weight: bold; }

        .sub-row { display: none; }
        .sub-row.visible { display: table-row; }
        .sub-row td:first-child { color: #ffd966 !important; font-weight: 400 !important; padding-left: 16px !important; font-size: 13px; }
        .sub-row .cell-free { background: #1a5a3a; font-size: 12px; padding: 4px 6px; min-width: 30px; }
        .sub-row .cell-occupied { font-size: 12px; }

        .btn-group { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; margin: 24px 0 18px; }
        .btn { background: linear-gradient(45deg, #ffb347, #ff8c00); border: none; padding: 14px 32px; font-size: 18px; font-weight: 700; border-radius: 60px; cursor: pointer; color: #0a0f1e; box-shadow: 0 8px 20px rgba(255, 140, 0, 0.3); transition: all 0.2s; display: inline-flex; align-items: center; gap: 8px; }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 12px 28px rgba(255, 140, 0, 0.5); }
        .btn:active { transform: translateY(2px); }
        .btn-save-cloud { background: linear-gradient(45deg, #27ae60, #2ecc71); color: #fff; box-shadow: 0 8px 20px rgba(46, 204, 113, 0.3); }
        .btn-save-cloud:hover { box-shadow: 0 12px 28px rgba(46, 204, 113, 0.5); }
        .btn-danger { background: linear-gradient(45deg, #c0392b, #e74c3c); color: #fff; box-shadow: 0 8px 20px rgba(231, 76, 60, 0.3); }
        .btn-danger:hover { box-shadow: 0 12px 28px rgba(231, 76, 60, 0.5); }

        .notice-board { margin-top: 30px; border-top: 2px solid rgba(255, 217, 102, 0.2); padding-top: 24px; }
        .notice-board h2 { color: #ffd966; font-size: 22px; margin-bottom: 16px; text-align: center; }
        .notice-list { display: flex; flex-direction: column; gap: 12px; max-width: 900px; margin: 0 auto; }
        .notice-item { background: rgba(20, 30, 45, 0.7); border-radius: 16px; padding: 16px 20px; border-left: 4px solid #ffd966; display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-wrap: wrap; }
        .notice-date { font-weight: 700; color: #ffd966; font-size: 16px; min-width: 100px; }
        .notice-text { flex: 1; color: #e8e8e8; word-break: break-word; }
        .notice-del { background: rgba(255, 70, 70, 0.2); border: 1px solid #ff4444; color: #ff6666; border-radius: 30px; padding: 4px 14px; cursor: pointer; font-size: 13px; transition: 0.2s; }
        .notice-del:hover { background: rgba(255, 70, 70, 0.4); }
        .empty-notice { color: #888; text-align: center; padding: 24px; font-style: italic; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(6px); z-index: 1000; justify-content: center; align-items: center; }
        .modal-overlay.active { display: flex; }
        .modal-card { background: #1a2a3a; border-radius: 32px; padding: 32px; max-width: 560px; width: 92%; border: 2px solid #ffd966; box-shadow: 0 30px 60px rgba(0,0,0,0.6); position: relative; }
        .modal-card h3 { color: #ffd966; font-size: 26px; margin-bottom: 20px; text-align: center; }
        .modal-card label { color: #ffdd99; font-weight: 600; display: block; margin-top: 12px; margin-bottom: 4px; }
        .modal-card input, .modal-card textarea { width: 100%; padding: 12px 16px; background: #0f1a24; border: 2px solid #4a6a8a; border-radius: 16px; color: #fff; font-size: 15px; transition: 0.2s; }
        .modal-card input:focus, .modal-card textarea:focus { border-color: #ffd966; outline: none; }
        .modal-card textarea { min-height: 100px; resize: vertical; }
        .modal-actions { display: flex; gap: 14px; justify-content: flex-end; margin-top: 24px; }
        .modal-actions .btn { padding: 10px 24px; font-size: 16px; }
        .modal-actions .btn-cancel { background: #555; box-shadow: none; }
        .modal-actions .btn-cancel:hover { background: #777; transform: none; }
        
        .report-modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(6px); z-index: 2000; justify-content: center; align-items: center; }
        .report-modal-overlay.active { display: flex; }
        .report-modal-card { background: #1a2a3a; border-radius: 32px; padding: 32px; max-width: 560px; width: 92%; border: 2px solid #ffd966; box-shadow: 0 30px 60px rgba(0,0,0,0.6); position: relative; }
        .report-modal-card h3 { color: #ffd966; font-size: 24px; margin-bottom: 10px; text-align: center; }
        .report-modal-card .report-date { color: #ffaa66; font-size: 16px; text-align: center; margin-bottom: 20px; }
        .report-modal-card .report-content { color: #e8e8e8; font-size: 16px; line-height: 1.6; white-space: pre-wrap; background: rgba(0,0,0,0.3); padding: 16px; border-radius: 12px; border-left: 4px solid #ffd966; }
        .report-close-btn { position: absolute; top: 16px; right: 20px; color: #888; font-size: 28px; cursor: pointer; transition: 0.2s; background: none; border: none; }
        .report-close-btn:hover { color: #ffd966; transform: scale(1.1); }

        .day-tiles-container { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 12px; }
        .day-tile { background: #1e2a3a; border: 2px solid #4a6a8a; border-radius: 12px; width: 70px; height: 70px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; color: #ffd966; font-weight: bold; text-align: center; font-size: 13px; box-shadow: 0 4px 8px rgba(0,0,0,0.3); }
        .day-tile:hover { border-color: #ffd966; transform: translateY(-2px); box-shadow: 0 8px 16px rgba(255, 217, 102, 0.2); }
        .day-tile .small-date { font-size: 11px; color: #aaa; font-weight: normal; }

        .footer-lock { margin-top: 20px; border-top: 2px solid rgba(255, 217, 102, 0.2); padding-top: 24px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
        .lock-btn { background: transparent; border: 2px solid #ffd966; color: #ffd966; border-radius: 50px; padding: 8px 20px; font-size: 16px; cursor: pointer; transition: 0.2s; font-weight: 600; }
        .lock-btn:hover { background: #ffd966; color: #0a0f1e; }
        .lock-btn.unlocked { border-color: #4CAF50; color: #4CAF50; background: rgba(76, 175, 80, 0.1); }
        .lock-btn.unlocked:hover { background: #4CAF50; color: #fff; }

        .admin-actions { display: none; flex-wrap: wrap; gap: 14px; justify-content: center; margin-top: 10px; }
        .admin-actions.active { display: flex; }

        @media (max-width: 700px) { table { font-size: 12px; } th:first-child { min-width: 100px; } td { padding: 6px 4px; } .btn { padding: 10px 18px; font-size: 15px; } .modal-card { padding: 20px; } .report-modal-card { padding: 20px; } }
        @media (max-width: 500px) { table { font-size: 10px; min-width: 500px; } .cell-free, .cell-occupied { min-width: 28px; padding: 4px 2px; } .btn { padding: 8px 12px; font-size: 13px; } }
    </style>
</head>
<body>

<div class="container">
    <div class="header-actions">
        <h1>📋 Служения — четверги</h1>
        <a href="index.html" class="back-link">← На главную</a>
    </div>

    <div class="table-wrap" id="tableWrap">
        <table id="serviceTable">
            <thead id="tableHead"><tr><th>Служение</th></tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <div class="btn-group">
        <button class="btn" id="addDayBtn">➕ Добавить день</button>
    </div>

    <div class="notice-board">
        <h2>📌 Заметки по дням</h2>
        <div class="day-tiles-container" id="dayTilesContainer"></div>
        <div style="margin-top: 20px;">
            <div class="notice-list" id="noticeList"></div>
        </div>
    </div>

    <div class="footer-lock">
        <button class="lock-btn" id="lockBtn">🔒 Редактировать</button>
        <div class="admin-actions" id="adminActions">
            <button class="btn btn-save-cloud" id="saveCloudBtn">☁️ Сохранить в облако</button>
            <button class="btn btn-danger" id="resetLocalBtn">🗑️ Очистить локальные</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="dayModal">
    <div class="modal-card">
        <h3>📅 Добавить день-плитку</h3>
        <label for="modalDayInput">Дата (день недели или число)</label>
        <input type="text" id="modalDayInput" placeholder="например: четверг 12.09" />
        <label for="modalTextInput">Текст отчета по этому дню</label>
        <textarea id="modalTextInput" placeholder="Подробности, отчет..."></textarea>
        <div class="modal-actions">
            <button class="btn btn-cancel" id="modalCancelBtn">Отмена</button>
            <button class="btn" id="modalSaveBtn">💾 Сохранить</button>
        </div>
    </div>
</div>

<div class="report-modal-overlay" id="reportModal">
    <div class="report-modal-card">
        <button class="report-close-btn" id="reportCloseBtn">✕</button>
        <h3>📄 Отчет</h3>
        <div class="report-date" id="reportDate">—</div>
        <div class="report-content" id="reportContent">—</div>
    </div>
</div>

<script>
    (function() {
        const ADMIN_PASSWORD = "1234"; 

        // ⚠️ ВСТАВЬТЕ СЮДА ДАННЫЕ ВАШЕГО GITHUB РЕПОЗИТОРИЯ
        const REPO_OWNER = "prudexxx";          // Например: prudexxx
        const REPO_NAME = "otchet";     // Например: my-table
        const GITHUB_TOKEN = "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"; 
        const DATA_FILE_PATH = "data.json";      // Имя файла, созданного в шаге 1
        // ============================================

        const SERVICE_KEYS = [
            "Ведущий", "Чайханщик", "Уборщик", "Закупщик", "Спикерхантер",
            "ПБУ", "ПГО", "ПСО", "Литком", "КАЗНАЧЕй", "ПРЕДСЕДАТЕЛь",
            "замПГО", "РС", "Водовоз", "Админ сайта"
        ];
        const DAYS = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"];

        let servicesData = {};
        let dayTiles = [];
        let notices = [];
        let openRoles = {};
        let isUnlocked = false;

        function loadLocalData() {
            try {
                const s = localStorage.getItem('mir_services_backup');
                if (s) servicesData = JSON.parse(s);
                const t = localStorage.getItem('mir_daytiles_backup');
                if (t) dayTiles = JSON.parse(t);
                const n = localStorage.getItem('mir_notices_backup');
                if (n) notices = JSON.parse(n);
            } catch(e) {}
        }
        function saveLocalData() {
            localStorage.setItem('mir_services_backup', JSON.stringify(servicesData));
            localStorage.setItem('mir_daytiles_backup', JSON.stringify(dayTiles));
            localStorage.setItem('mir_notices_backup', JSON.stringify(notices));
        }

        function getThursdays() {
            const now = new Date();
            let startDate = new Date(2026, 7, 6); 
            while (startDate.getDay() !== 4) startDate.setDate(startDate.getDate() + 1);

            const results = []; let current = new Date(startDate);
            const oneMonthAgo = new Date(now); oneMonthAgo.setDate(oneMonthAgo.getDate() - 30);
            const endDate = new Date(now.getFullYear() + 5, 11, 31);

            while (current <= endDate) {
                const y = current.getFullYear(); const m = String(current.getMonth() + 1).padStart(2, '0');
                const day = String(current.getDate()).padStart(2, '0');
                results.push({ dateObj: new Date(current), label: `${day}.${m}`, full: `${y}-${m}-${day}` });
                current.setDate(current.getDate() + 7);
            }
            return results.filter(t => t.dateObj >= oneMonthAgo);
        }

        function renderTable() {
            const thead = document.getElementById('tableHead');
            const tbody = document.getElementById('tableBody');
            const thursdays = getThursdays();

            if (thursdays.length === 0) {
                thead.innerHTML = '<tr><th>Служение</th></tr>';
                tbody.innerHTML = '<tr><td colspan="2" style="text-align:center; padding:20px; color:#888;">Нет актуальных четвергов</td></tr>';
                return;
            }

            let headerRow = '<tr><th>Служение</th>';
            thursdays.forEach(t => { headerRow += `<th class="th-date">${t.label}<small>чт</small></th>`; });
            headerRow += '</tr>';
            thead.innerHTML = headerRow;

            let bodyHtml = '';
            
            SERVICE_KEYS.forEach(key => {
                const isClickable = (key === "Ведущий" || key === "Чайханщик" || key === "Уборщик");
                const classAttr = isClickable ? 'class="clickable-header" data-role="' + key + '"' : '';
                
                bodyHtml += `<tr><td ${classAttr}>${key}</td>`;

                thursdays.forEach(t => {
                    const full = t.full;
                    let value = servicesData[key]?.[full] || '—';
                    let isFree = (value === '—');
                    const cls = isFree ? 'cell-free' : 'cell-occupied';

                    if (isUnlocked) {
                        bodyHtml += `<td class="editable-cell">
                            <select data-role="${key}" data-date="${full}">
                                <option value="—" ${value === '—' ? 'selected' : ''}>—</option>
                                <option value="П" class="status-P" ${value === 'П' ? 'selected' : ''}>П (Присутствовал)</option>
                                <option value="О" class="status-O" ${value === 'О' ? 'selected' : ''}>О (Отсутствовал)</option>
                                <option value="У" class="status-U" ${value === 'У' ? 'selected' : ''}>У (Уважительная)</option>
                            </select>
                        </td>`;
                    } else {
                        let displayValue = value;
                        if (value === 'П') displayValue = '✅ П';
                        else if (value === 'О') displayValue = '❌ О';
                        else if (value === 'У') displayValue = '⚠️ У';
                        
                        bodyHtml += `<td><span class="${cls}">${displayValue}</span></td>`;
                    }
                });
                bodyHtml += '</tr>';

                if (isClickable) {
                    const isOpen = openRoles[key] || false;
                    DAYS.forEach(day => {
                        const rowKey = `${key} ${day}`;
                        const visibilityClass = isOpen ? 'visible' : '';
                        bodyHtml += `<tr class="sub-row ${visibilityClass}"><td>${rowKey}</td>`;

                        thursdays.forEach(t => {
                            const full = t.full;
                            let value = servicesData[rowKey]?.[full] || '—';
                            let isFree = (value === '—');
                            const cls = isFree ? 'cell-free' : 'cell-occupied';

                            if (isUnlocked) {
                                bodyHtml += `<td class="editable-cell">
                                    <select data-role="${rowKey}" data-date="${full}">
                                        <option value="—" ${value === '—' ? 'selected' : ''}>—</option>
                                        <option value="П" class="status-P" ${value === 'П' ? 'selected' : ''}>П (Присутствовал)</option>
                                        <option value="О" class="status-O" ${value === 'О' ? 'selected' : ''}>О (Отсутствовал)</option>
                                        <option value="У" class="status-U" ${value === 'У' ? 'selected' : ''}>У (Уважительная)</option>
                                    </select>
                                </td>`;
                            } else {
                                let displayValue = value;
                                if (value === 'П') displayValue = '✅ П';
                                else if (value === 'О') displayValue = '❌ О';
                                else if (value === 'У') displayValue = '⚠️ У';
                                bodyHtml += `<td><span class="${cls}">${displayValue}</span></td>`;
                            }
                        });
                        bodyHtml += '</tr>';
                    });
                }
            });
            tbody.innerHTML = bodyHtml;

            document.querySelectorAll('.editable-cell select').forEach(select => {
                select.addEventListener('change', function() {
                    const role = this.dataset.role;
                    const date = this.dataset.date;
                    const value = this.value;
                    if (!servicesData[role]) servicesData[role] = {};
                    servicesData[role][date] = value;
                    saveLocalData();
                });
            });

            document.querySelectorAll('.clickable-header').forEach(td => {
                td.addEventListener('click', function() {
                    const role = this.dataset.role;
                    openRoles[role] = !openRoles[role];
                    renderTable(); 
                });
            });
            
            setTimeout(() => {
                const wrap = document.getElementById('tableWrap');
                const ths = wrap.querySelectorAll('thead th');
                let idx = -1;
                ths.forEach((th, i) => { if(th.innerText.includes('30.09')) idx = i; });
                if(idx !== -1 && wrap.querySelector('tbody tr')) {
                    const cell = wrap.querySelector('tbody tr').querySelectorAll('td')[idx];
                    if(cell) wrap.scrollLeft = cell.offsetLeft + cell.offsetWidth - wrap.clientWidth + 50;
                }
            }, 100);
        }

        function renderDayTiles() {
            const container = document.getElementById('dayTilesContainer');
            if (!dayTiles.length) {
                container.innerHTML = `<div style="color:#888; text-align:center; width:100%; padding:20px;">Нет добавленных дней</div>`;
                return;
            }
            let html = '';
            dayTiles.forEach((item, index) => {
                html += `
                    <div class="day-tile" data-index="${index}">
                        <span>${item.date || '—'}</span>
                        <span class="small-date">отчет</span>
                    </div>
                `;
            });
            container.innerHTML = html;
            container.querySelectorAll('.day-tile').forEach(tile => {
                tile.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.index);
                    if (!isNaN(idx) && dayTiles[idx]) {
                        document.getElementById('reportDate').innerText = dayTiles[idx].date || '—';
                        document.getElementById('reportContent').innerText = dayTiles[idx].report || 'Нет текста';
                        document.getElementById('reportModal').classList.add('active');
                    }
                });
            });
        }

        function renderNotices() {
            const container = document.getElementById('noticeList');
            if (!notices.length) {
                container.innerHTML = `<div class="empty-notice">📭 Пока нет заметок.</div>`;
                return;
            }
            let html = '';
            notices.forEach((item, index) => {
                html += `
                    <div class="notice-item">
                        <span class="notice-date">${item.date || '—'}</span>
                        <span class="notice-text">${item.text || ''}</span>
                        <span class="notice-del" data-index="${index}">✖ удалить</span>
                    </div>
                `;
            });
            container.innerHTML = html;
            container.querySelectorAll('.notice-del').forEach(btn => {
                btn.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.index, 10);
                    if (!isNaN(idx) && idx >= 0 && idx < notices.length) {
                        notices.splice(idx, 1);
                        saveLocalData();
                        renderNotices();
                    }
                });
            });
        }

        function refreshAll() {
            loadLocalData();
            renderTable();
            renderDayTiles();
            renderNotices();
        }

        const lockBtn = document.getElementById('lockBtn');
        const adminActions = document.getElementById('adminActions');

        lockBtn.addEventListener('click', function() {
            if (!isUnlocked) {
                const pass = prompt("Введите код доступа для редактирования:");
                if (pass === ADMIN_PASSWORD) {
                    isUnlocked = true;
                    lockBtn.innerHTML = "🔓 Редактирование открыто";
                    lockBtn.classList.add('unlocked');
                    adminActions.classList.add('active');
                    renderTable();
                } else {
                    alert("Неверный код!");
                }
            } else {
                isUnlocked = false;
                lockBtn.innerHTML = "🔒 Редактировать";
                lockBtn.classList.remove('unlocked');
                adminActions.classList.remove('active');
                renderTable();
            }
        });

        // ================= GitHub API ЛОГИКА =================

        async function fetchFromGitHub() {
            const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${DATA_FILE_PATH}`;
            const response = await fetch(url, {
                headers: { 'Authorization': `token ${GITHUB_TOKEN}` }
            });
            if (!response.ok) throw new Error(`GitHub API Error: ${response.status}`);
            const data = await response.json();
            // GitHub возвращает файл в base64
            const content = atob(data.content);
            return JSON.parse(content);
        }

        async function saveToGitHub(dataObj) {
            // 1. Сначала получаем текущий файл, чтобы узнать его SHA (хэш)
            const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${DATA_FILE_PATH}`;
            const getResponse = await fetch(url, {
                headers: { 'Authorization': `token ${GITHUB_TOKEN}` }
            });
            if (!getResponse.ok) throw new Error(`GitHub API Error (GET): ${getResponse.status}`);
            const fileData = await getResponse.json();
            const sha = fileData.sha;

            // 2. Перезаписываем файл
            const contentString = JSON.stringify(dataObj, null, 2);
            const putResponse = await fetch(url, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${GITHUB_TOKEN}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: "Update table data via web app",
                    content: btoa(contentString),
                    sha: sha
                })
            });
            if (!putResponse.ok) {
                const errDetail = await putResponse.json();
                throw new Error(`GitHub API Error (PUT): ${putResponse.status} - ${errDetail.message}`);
            }
            return await putResponse.json();
        }

        document.getElementById('saveCloudBtn').addEventListener('click', async function() {
            if(!REPO_OWNER || REPO_OWNER === "ваш_логин") {
                alert("Сначала настройте переменные REPO_OWNER, REPO_NAME и GITHUB_TOKEN в коде!");
                return;
            }

            const btn = this;
            btn.innerText = "⏳ Сохраняем...";
            btn.disabled = true;

            try {
                const thursdays = getThursdays();
                let tableData = [['Служение', ...thursdays.map(t => t.label)]];
                
                SERVICE_KEYS.forEach(key => {
                    let row = [key];
                    thursdays.forEach(t => { row.push(servicesData[key]?.[t.full] || '—'); });
                    tableData.push(row);
                });
                
                const targetRoles = ["Ведущий", "Чайханщик", "Уборщик"];
                targetRoles.forEach(role => {
                    DAYS.forEach(day => {
                        let row = [`${role} ${day}`];
                        thursdays.forEach(t => { row.push(servicesData[`${role} ${day}`]?.[t.full] || '—'); });
                        tableData.push(row);
                    });
                });

                // Упаковываем в JSON структуру
                const dataToSave = {
                    services: servicesData,
                    dayTiles: dayTiles,
                    notices: notices
                };

                await saveToGitHub(dataToSave);
                alert("✅ Данные успешно сохранены в репозиторий GitHub!");
                
            } catch (err) {
                alert("❌ Ошибка при сохранении в GitHub:\n" + err.message + "\n\nДанные сохранены локально.");
            } finally {
                btn.innerText = "☁️ Сохранить в облако";
                btn.disabled = false;
            }
        });

        document.getElementById('resetLocalBtn').addEventListener('click', function() {
            if(confirm("Вы уверены, что хотите очистить все локальные данные?")) {
                localStorage.removeItem('mir_services_backup');
                localStorage.removeItem('mir_daytiles_backup');
                localStorage.removeItem('mir_notices_backup');
                servicesData = {}; dayTiles = []; notices = [];
                renderTable(); renderDayTiles(); renderNotices();
                alert("Локальные данные очищены.");
            }
        });

        // Загрузка при старте
        async function loadFromGitHub() {
            if(!REPO_OWNER || REPO_OWNER === "ваш_логин") {
                refreshAll(); 
                return;
            }

            try {
                const data = await fetchFromGitHub();
                if (data.services) servicesData = data.services;
                if (data.dayTiles) dayTiles = data.dayTiles;
                if (data.notices) notices = data.notices;
                
                saveLocalData();
                renderTable(); renderDayTiles(); renderNotices();
                alert("✅ Данные успешно подгружены из GitHub!");
            } catch (err) {
                console.warn("Не удалось загрузить из GitHub, используются локальные данные.", err);
                refreshAll();
            }
        }

        const modal = document.getElementById('dayModal');
        document.getElementById('addDayBtn').addEventListener('click', function() {
            document.getElementById('modalDayInput').value = '';
            document.getElementById('modalTextInput').value = '';
            modal.classList.add('active');
        });
        document.getElementById('modalCancelBtn').addEventListener('click', () => modal.classList.remove('active'));
        modal.addEventListener('click', function(e) { if (e.target === modal) modal.classList.remove('active'); });
        document.getElementById('modalSaveBtn').addEventListener('click', function() {
            const date = document.getElementById('modalDayInput').value.trim();
            const text = document.getElementById('modalTextInput').value.trim();
            if (!date) { alert('Введите дату'); return; }
            if (!text) { alert('Введите текст отчета'); return; }
            dayTiles.push({ date, report: text });
            saveLocalData();
            renderDayTiles();
            modal.classList.remove('active');
        });

        document.getElementById('reportCloseBtn').addEventListener('click', function() {
            document.getElementById('reportModal').classList.remove('active');
        });
        document.getElementById('reportModal').addEventListener('click', function(e) {
            if (e.target === this) this.classList.remove('active');
        });

        loadLocalData(); 
        loadFromGitHub(); 
    })();
</script>

</body>
