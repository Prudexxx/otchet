<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таблица служащих — четверги</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0a0f1e 0%, #0a1a2a 100%);
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            padding: 20px;
            color: #f0f0f0;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(15, 25, 45, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 24px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.3);
            overflow-x: auto;
        }
        h1 { color: #ffd966; font-size: clamp(24px, 4vw, 36px); margin-bottom: 20px; text-align: center; letter-spacing: 1px; }
        .header-actions { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
        .back-link { color: #ffd966; text-decoration: none; font-weight: 600; padding: 8px 18px; border: 1px solid #ffd966; border-radius: 40px; transition: 0.2s; }
        .back-link:hover { background: #ffd966; color: #0a0f1e; }
        
        .table-wrap { overflow-x: auto; margin: 16px 0 0; border-radius: 20px; border: 1px solid rgba(255, 217, 102, 0.2); }
        table { width: 100%; border-collapse: collapse; background: rgba(20, 30, 45, 0.6); font-size: 14px; min-width: 700px; }
        th { background: linear-gradient(145deg, #1e2a3a, #0f1a24); color: #ffd966; font-weight: 700; padding: 12px 8px; border: 1px solid rgba(255, 217, 102, 0.25); text-align: center; position: sticky; top: 0; z-index: 10; }
        th:first-child { min-width: 140px; text-align: left; padding-left: 16px; position: sticky; left: 0; z-index: 11; background: #1e2a3a; }
        td { padding: 10px 6px; border: 1px solid rgba(255, 217, 102, 0.15); text-align: center; vertical-align: middle; background: rgba(15, 25, 45, 0.4); }
        td:first-child { font-weight: 600; color: #ffdd99; text-align: left; padding-left: 16px; background: rgba(20, 30, 45, 0.6); border-right: 2px solid rgba(255, 217, 102, 0.3); position: sticky; left: 0; z-index: 5; }
        
        .clickable-header { color: #ffd966 !important; cursor: pointer; text-decoration: underline; text-underline-offset: 4px; transition: 0.2s; }
        .clickable-header:hover { background: rgba(255, 217, 102, 0.1); }

        .cell-free { background: linear-gradient(145deg, #1e7a4a, #0f5e38); color: #fff; font-weight: bold; border-radius: 12px; padding: 6px 4px; display: inline-block; min-width: 40px; cursor: default; }
        .cell-occupied { color: #ccc; padding: 6px 4px; display: inline-block; min-width: 40px; }

        .editable-cell select { background: #0f1a24; color: #fff; border: 2px solid #4a6a8a; border-radius: 12px; padding: 6px 10px; font-size: 14px; font-weight: bold; text-align: center; width: 100%; outline: none; cursor: pointer; }
        .editable-cell select:focus { border-color: #ffd966; }
        .editable-cell select option { background: #1a2a3a; color: #fff; }
        
        .status-P { color: #4CAF50; font-weight: bold; }
        .status-O { color: #f44336; font-weight: bold; }
        .status-U { color: #ff9800; font-weight: bold; }

        .sub-row { display: none; }
        .sub-row.visible { display: table-row; }
        .sub-row td:first-child { color: #ffd966 !important; font-weight: 400 !important; padding-left: 16px !important; font-size: 13px; }
        .sub-row .cell-free { background: #1a5a3a; font-size: 12px; padding: 4px 6px; min-width: 30px; }
        .sub-row .cell-occupied { font-size: 12px; }

        .btn-group { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; margin: 24px 0 18px; }
        .btn { background: linear-gradient(45deg, #ffb347, #ff8c00); border: none; padding: 14px 32px; font-size: 18px; font-weight: 700; border-radius: 60px; cursor: pointer; color: #0a0f1e; box-shadow: 0 8px 20px rgba(255, 140, 0, 0.3); transition: all 0.2s; display: inline-flex; align-items: center; gap: 8px; }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 12px 28px rgba(255, 140, 0, 0.5); }
        .btn:active { transform: translateY(2px); }
        .btn-save-cloud { background: linear-gradient(45deg, #27ae60, #2ecc71); color: #fff; box-shadow: 0 8px 20px rgba(46, 204, 113, 0.3); }
        .btn-save-cloud:hover { box-shadow: 0 12px 28px rgba(46, 204, 113, 0.5); }
        .btn-danger { background: linear-gradient(45deg, #c0392b, #e74c3c); color: #fff; box-shadow: 0 8px 20px rgba(231, 76, 60, 0.3); }
        .btn-danger:hover { box-shadow: 0 12px 28px rgba(231, 76, 60, 0.5); }

        .notice-board { margin-top: 30px; border-top: 2px solid rgba(255, 217, 102, 0.2); padding-top: 24px; }
        .notice-board h2 { color: #ffd966; font-size: 22px; margin-bottom: 16px; text-align: center; }
        .notice-list { display: flex; flex-direction: column; gap: 12px; max-width: 900px; margin: 0 auto; }
        .notice-item { background: rgba(20, 30, 45, 0.7); border-radius: 16px; padding: 16px 20px; border-left: 4px solid #ffd966; display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-wrap: wrap; }
        .notice-date { font-weight: 700; color: #ffd966; font-size: 16px; min-width: 100px; }
        .notice-text { flex: 1; color: #e8e8e8; word-break: break-word; }
        .notice-del { background: rgba(255, 70, 70, 0.2); border: 1px solid #ff4444; color: #ff6666; border-radius: 30px; padding: 4px 14px; cursor: pointer; font-size: 13px; transition: 0.2s; }
        .notice-del:hover { background: rgba(255, 70, 70, 0.4); }
        .empty-notice { color: #888; text-align: center; padding: 24px; font-style: italic; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(6px); z-index: 1000; justify-content: center; align-items: center; }
        .modal-overlay.active { display: flex; }
        .modal-card { background: #1a2a3a; border-radius: 32px; padding: 32px; max-width: 560px; width: 92%; border: 2px solid #ffd966; box-shadow: 0 30px 60px rgba(0,0,0,0.6); position: relative; }
        .modal-card h3 { color: #ffd966; font-size: 26px; margin-bottom: 20px; text-align: center; }
        .modal-card label { color: #ffdd99; font-weight: 600; display: block; margin-top: 12px; margin-bottom: 4px; }
        .modal-card input, .modal-card textarea { width: 100%; padding: 12px 16px; background: #0f1a24; border: 2px solid #4a6a8a; border-radius: 16px; color: #fff; font-size: 15px; transition: 0.2s; }
        .modal-card input:focus, .modal-card textarea:focus { border-color: #ffd966; outline: none; }
        .modal-card textarea { min-height: 100px; resize: vertical; }
        .modal-actions { display: flex; gap: 14px; justify-content: flex-end; margin-top: 24px; }
        .modal-actions .btn { padding: 10px 24px; font-size: 16px; }
        .modal-actions .btn-cancel { background: #555; box-shadow: none; }
        .modal-actions .btn-cancel:hover { background: #777; transform: none; }
        
        .report-modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(6px); z-index: 2000; justify-content: center; align-items: center; }
        .report-modal-overlay.active { display: flex; }
        .report-modal-card { background: #1a2a3a; border-radius: 32px; padding: 32px; max-width: 560px; width: 92%; border: 2px solid #ffd966; box-shadow: 0 30px 60px rgba(0,0,0,0.6); position: relative; }
        .report-modal-card h3 { color: #ffd966; font-size: 24px; margin-bottom: 10px; text-align: center; }
        .report-modal-card .report-date { color: #ffaa66; font-size: 16px; text-align: center; margin-bottom: 20px; }
        .report-modal-card .report-content { color: #e8e8e8; font-size: 16px; line-height: 1.6; white-space: pre-wrap; background: rgba(0,0,0,0.3); padding: 16px; border-radius: 12px; border-left: 4px solid #ffd966; }
        .report-close-btn { position: absolute; top: 16px; right: 20px; color: #888; font-size: 28px; cursor: pointer; transition: 0.2s; background: none; border: none; }
        .report-close-btn:hover { color: #ffd966; transform: scale(1.1); }

        .day-tiles-container { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 12px; }
        .day-tile { background: #1e2a3a; border: 2px solid #4a6a8a; border-radius: 12px; width: 70px; height: 70px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; color: #ffd966; font-weight: bold; text-align: center; font-size: 13px; box-shadow: 0 4px 8px rgba(0,0,0,0.3); }
        .day-tile:hover { border-color: #ffd966; transform: translateY(-2px); box-shadow: 0 8px 16px rgba(255, 217, 102, 0.2); }
        .day-tile .small-date { font-size: 11px; color: #aaa; font-weight: normal; }

        .footer-lock { margin-top: 20px; border-top: 2px solid rgba(255, 217, 102, 0.2); padding-top: 24px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
        .lock-btn { background: transparent; border: 2px solid #ffd966; color: #ffd966; border-radius: 50px; padding: 8px 20px; font-size: 16px; cursor: pointer; transition: 0.2s; font-weight: 600; }
        .lock-btn:hover { background: #ffd966; color: #0a0f1e; }
        .lock-btn.unlocked { border-color: #4CAF50; color: #4CAF50; background: rgba(76, 175, 80, 0.1); }
        .lock-btn.unlocked:hover { background: #4CAF50; color: #fff; }

        .admin-actions { display: none; flex-wrap: wrap; gap: 14px; justify-content: center; margin-top: 10px; }
        .admin-actions.active { display: flex; }

        @media (max-width: 700px) { table { font-size: 12px; } th:first-child { min-width: 100px; } td { padding: 6px 4px; } .btn { padding: 10px 18px; font-size: 15px; } .modal-card { padding: 20px; } .report-modal-card { padding: 20px; } }
        @media (max-width: 500px) { table { font-size: 10px; min-width: 500px; } .cell-free, .cell-occupied { min-width: 28px; padding: 4px 2px; } .btn { padding: 8px 12px; font-size: 13px; } }
    </style>
</head>
<body>

<div class="container">
    <div class="header-actions">
        <h1>📋 Служения — четверги</h1>
        <a href="index.html" class="back-link">← На главную</a>
    </div>

    <div class="table-wrap" id="tableWrap">
        <table id="serviceTable">
            <thead id="tableHead"><tr><th>Служение</th></tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <div class="btn-group">
        <button class="btn" id="addDayBtn">➕ Добавить день</button>
    </div>

    <div class="notice-board">
        <h2>📌 Заметки по дням</h2>
        <div class="day-tiles-container" id="dayTilesContainer"></div>
        <div style="margin-top: 20px;">
            <div class="notice-list" id="noticeList"></div>
        </div>
    </div>

    <div class="footer-lock">
        <button class="lock-btn" id="lockBtn">🔒 Редактировать</button>
        <div class="admin-actions" id="adminActions">
            <button class="btn btn-save-cloud" id="saveCloudBtn">☁️ Сохранить в облако</button>
            <button class="btn btn-danger" id="resetLocalBtn">🗑️ Очистить локальные</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="dayModal">
    <div class="modal-card">
        <h3>📅 Добавить день-плитку</h3>
        <label for="modalDayInput">Дата (день недели или число)</label>
        <input type="text" id="modalDayInput" placeholder="например: четверг 12.09" />
        <label for="modalTextInput">Текст отчета по этому дню</label>
        <textarea id="modalTextInput" placeholder="Подробности, отчет..."></textarea>
        <div class="modal-actions">
            <button class="btn btn-cancel" id="modalCancelBtn">Отмена</button>
            <button class="btn" id="modalSaveBtn">💾 Сохранить</button>
        </div>
    </div>
</div>

<div class="report-modal-overlay" id="reportModal">
    <div class="report-modal-card">
        <button class="report-close-btn" id="reportCloseBtn">✕</button>
        <h3>📄 Отчет</h3>
        <div class="report-date" id="reportDate">—</div>
        <div class="report-content" id="reportContent">—</div>
    </div>
</div>

<script src="on.js"></script>

</body>
</html>
