<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таблица служащих — четверги</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0a0f1e 0%, #0a1a2a 100%);
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            padding: 20px;
            color: #f0f0f0;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(15, 25, 45, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 24px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.3);
            overflow-x: auto;
        }
        h1 {
            color: #ffd966;
            font-size: clamp(24px, 4vw, 36px);
            margin-bottom: 20px;
            text-align: center;
            letter-spacing: 1px;
        }
        .header-actions { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
        .back-link {
            color: #ffd966; text-decoration: none; font-weight: 600;
            padding: 8px 18px; border: 1px solid #ffd966; border-radius: 40px; transition: 0.2s;
        }
        .back-link:hover { background: #ffd966; color: #0a0f1e; }

        /* Основная таблица */
        .table-wrap { overflow-x: auto; margin: 16px 0 0; border-radius: 20px; border: 1px solid rgba(255, 217, 102, 0.2); }
        table {
            width: 100%; border-collapse: collapse; background: rgba(20, 30, 45, 0.6);
            font-size: 14px; min-width: 700px;
        }
        th {
            background: linear-gradient(145deg, #1e2a3a, #0f1a24);
            color: #ffd966; font-weight: 700; padding: 12px 8px;
            border: 1px solid rgba(255, 217, 102, 0.25); text-align: center;
            position: sticky; top: 0; z-index: 10;
        }
        th:first-child { min-width: 140px; text-align: left; padding-left: 16px; position: sticky; left: 0; z-index: 11; background: #1e2a3a; }
        td {
            padding: 10px 6px; border: 1px solid rgba(255, 217, 102, 0.15);
            text-align: center; vertical-align: middle; background: rgba(15, 25, 45, 0.4);
        }
        td:first-child {
            font-weight: 600; color: #ffdd99; text-align: left; padding-left: 16px;
            background: rgba(20, 30, 45, 0.6); border-right: 2px solid rgba(255, 217, 102, 0.3);
            position: sticky; left: 0; z-index: 5;
        }
        
        .clickable-header {
            color: #ffd966 !important;
            cursor: pointer;
            text-decoration: underline;
            text-underline-offset: 4px;
            transition: 0.2s;
        }
        .clickable-header:hover { background: rgba(255, 217, 102, 0.1); }

        .cell-free { background: linear-gradient(145deg, #1e7a4a, #0f5e38); color: #fff; font-weight: bold; border-radius: 12px; padding: 6px 4px; display: inline-block; min-width: 40px; cursor: default; }
        .cell-occupied { color: #ccc; padding: 6px 4px; display: inline-block; min-width: 40px; }

        .sub-row { display: none; }
        .sub-row.visible { display: table-row; }
        .sub-row td:first-child { color: #ffd966 !important; font-weight: 400 !important; padding-left: 16px !important; font-size: 13px; }
        .sub-row .cell-free { background: #1a5a3a; font-size: 12px; padding: 4px 6px; min-width: 30px; }
        .sub-row .cell-occupied { font-size: 12px; }

        /* Стили для селектов (режим редактирования) */
        .edit-cell-select {
            width: 100%;
            padding: 6px 4px;
            border-radius: 12px;
            border: 2px solid #ffd966;
            background: #0f1a24;
            color: #fff;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
            outline: none;
        }
        .edit-cell-select option { background: #1a2a3a; color: #fff; }

        /* Стили для П/О/У в режиме просмотра */
        .status-P { color: #4CAF50; font-weight: bold; }
        .status-O { color: #f44336; font-weight: bold; }
        .status-U { color: #ff9800; font-weight: bold; }

        .btn-group { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; margin: 24px 0 18px; }
        .btn {
            background: linear-gradient(45deg, #ffb347, #ff8c00); border: none; padding: 14px 32px;
            font-size: 18px; font-weight: 700; border-radius: 60px; cursor: pointer;
            color: #0a0f1e; box-shadow: 0 8px 20px rgba(255, 140, 0, 0.3);
            transition: all 0.2s; display: inline-flex; align-items: center; gap: 8px;
        }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 12px 28px rgba(255, 140, 0, 0.5); }
        .btn:active { transform: translateY(2px); }
        .btn-secondary { background: linear-gradient(45deg, #4a6fa5, #2c4a7a); color: #fff; box-shadow: 0 8px 20px rgba(42, 85, 150, 0.3); }
        .btn-secondary:hover { box-shadow: 0 12px 28px rgba(42, 85, 150, 0.5); }

        .notice-board { margin-top: 30px; border-top: 2px solid rgba(255, 217, 102, 0.2); padding-top: 24px; }
        .notice-board h2 { color: #ffd966; font-size: 22px; margin-bottom: 16px; text-align: center; }
        .notice-list { display: flex; flex-direction: column; gap: 12px; max-width: 900px; margin: 0 auto; }
        .notice-item { background: rgba(20, 30, 45, 0.7); border-radius: 16px; padding: 16px 20px; border-left: 4px solid #ffd966; display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-wrap: wrap; }
        .notice-date { font-weight: 700; color: #ffd966; font-size: 16px; min-width: 100px; }
        .notice-text { flex: 1; color: #e8e8e8; word-break: break-word; }
        .notice-del { background: rgba(255, 70, 70, 0.2); border: 1px solid #ff4444; color: #ff6666; border-radius: 30px; padding: 4px 14px; cursor: pointer; font-size: 13px; transition: 0.2s; }
        .notice-del:hover { background: rgba(255, 70, 70, 0.4); }
        .empty-notice { color: #888; text-align: center; padding: 24px; font-style: italic; }

        /* Модалки */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(6px); z-index: 1000; justify-content: center; align-items: center; }
        .modal-overlay.active { display: flex; }
        .modal-card { background: #1a2a3a; border-radius: 32px; padding: 32px; max-width: 560px; width: 92%; border: 2px solid #ffd966; box-shadow: 0 30px 60px rgba(0,0,0,0.6); position: relative; }
        .modal-card h3 { color: #ffd966; font-size: 26px; margin-bottom: 20px; text-align: center; }
        .modal-card label { color: #ffdd99; font-weight: 600; display: block; margin-top: 12px; margin-bottom: 4px; }
        .modal-card input, .modal-card textarea { width: 100%; padding: 12px 16px; background: #0f1a24; border: 2px solid #4a6a8a; border-radius: 16px; color: #fff; font-size: 15px; transition: 0.2s; }
        .modal-card input:focus, .modal-card textarea:focus { border-color: #ffd966; outline: none; }
        .modal-card textarea { min-height: 100px; resize: vertical; }
        .modal-actions { display: flex; gap: 14px; justify-content: flex-end; margin-top: 24px; }
        .modal-actions .btn { padding: 10px 24px; font-size: 16px; }
        .modal-actions .btn-cancel { background: #555; box-shadow: none; }
        .modal-actions .btn-cancel:hover { background: #777; transform: none; }
        
        .report-modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(6px); z-index: 2000; justify-content: center; align-items: center; }
        .report-modal-overlay.active { display: flex; }
        .report-modal-card { background: #1a2a3a; border-radius: 32px; padding: 32px; max-width: 560px; width: 92%; border: 2px solid #ffd966; box-shadow: 0 30px 60px rgba(0,0,0,0.6); position: relative; }
        .report-modal-card h3 { color: #ffd966; font-size: 24px; margin-bottom: 10px; text-align: center; }
        .report-modal-card .report-date { color: #ffaa66; font-size: 16px; text-align: center; margin-bottom: 20px; }
        .report-modal-card .report-content { color: #e8e8e8; font-size: 16px; line-height: 1.6; white-space: pre-wrap; background: rgba(0,0,0,0.3); padding: 16px; border-radius: 12px; border-left: 4px solid #ffd966; }
        .report-close-btn { position: absolute; top: 16px; right: 20px; color: #888; font-size: 28px; cursor: pointer; transition: 0.2s; background: none; border: none; }
        .report-close-btn:hover { color: #ffd966; transform: scale(1.1); }

        .day-tiles-container { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 12px; }
        .day-tile { background: #1e2a3a; border: 2px solid #4a6a8a; border-radius: 12px; width: 70px; height: 70px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; color: #ffd966; font-weight: bold; text-align: center; font-size: 13px; box-shadow: 0 4px 8px rgba(0,0,0,0.3); }
        .day-tile:hover { border-color: #ffd966; transform: translateY(-2px); box-shadow: 0 8px 16px rgba(255, 217, 102, 0.2); }
        .day-tile .small-date { font-size: 11px; color: #aaa; font-weight: normal; }

        /* АДМИН ПАНЕЛЬ */
        .central-wrapper { display: flex; flex-direction: column; align-items: center; max-width: 550px; margin: 20px auto 0; }
        .lock-button { background: radial-gradient(circle at 30% 25%, #f6e7c5, #deb887); border: none; width: 100px; height: 100px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; margin: 20px auto; }
        .lock-svg { width: 50px; height: 50px; }
        .info-panel { background: rgba(255, 248, 225, 0.95); border-radius: 42px; padding: 20px; width: 100%; text-align: center; display: none; }
        .info-panel.visible { display: block; }
        .info-title { font-size: 24px; color: #7a5c2e; margin-bottom: 15px; }
        .edit-btn { background: #d4af37; border: none; padding: 12px 20px; border-radius: 40px; font-weight: bold; cursor: pointer; margin: 8px; }
        .edit-btn.danger { background: #f44336; color: white; }
        .edit-btn.success { background: #4CAF50; color: white; }
        .edit-status { margin-top: 15px; padding: 10px; background: #333; border-radius: 30px; color: #ffd966; }
        .sync-status { font-size: 12px; margin-top: 10px; color: #666; }

        .modal-password { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); display: none; justify-content: center; align-items: center; z-index: 5000; }
        .modal-password.active { display: flex; }
        .modal-password-card { background: #fef7e0; border-radius: 48px; padding: 30px; width: 90%; max-width: 350px; text-align: center; }
        .modal-password-card h3 { color: #7a5c2e; margin-bottom: 20px; }
        .password-input { width: 100%; padding: 14px; border: 2px solid #e4c37b; border-radius: 60px; text-align: center; font-size: 18px; margin: 15px 0; }
        .modal-buttons { display: flex; gap: 10px; justify-content: center; }
        .modal-btn { padding: 10px 20px; border-radius: 40px; border: none; cursor: pointer; font-weight: bold; }
        .modal-btn.primary { background: #d4af37; }
        .modal-btn.secondary { background: #ccc; }

        @media (max-width: 700px) { table { font-size: 12px; } th:first-child { min-width: 100px; } td { padding: 6px 4px; } .btn { padding: 10px 18px; font-size: 15px; } .modal-card { padding: 20px; } .report-modal-card { padding: 20px; } }
        @media (max-width: 500px) { table { font-size: 10px; min-width: 500px; } .cell-free, .cell-occupied { min-width: 28px; padding: 4px 2px; } .btn { padding: 8px 12px; font-size: 13px; } }
    </style>
</head>
<body>

<div class="container">
    <div class="header-actions">
         <h1>📋 Посещаемость рабочего вечернего собрания группы Мира</h1>
        <a href="index.html" class="back-link">← На главную</a>
    </div>

    <div class="table-wrap">
        <table id="serviceTable">
            <thead id="tableHead"><tr><th>Служение</th></tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <div class="notice-board">
        <h2>📌 Отчеты рабочих собраний</h2>
        <div class="day-tiles-container" id="dayTilesContainer"></div>
        <div style="margin-top: 20px;">
            <div class="notice-list" id="noticeList"></div>
        </div>
    </div>

    <div class="central-wrapper">
        <button class="lock-button" id="lockBtn">
            <svg class="lock-svg" viewBox="0 0 24 24" fill="none">
                <path d="M17 9V7C17 4.23858 14.7614 2 12 2C9.23858 2 7 4.23858 7 7V9H6C4.89543 9 4 9.89543 4 11V19C4 20.1046 4.89543 21 6 21H18C19.1046 21 20 20.1046 20 19V11C20 9.89543 19.1046 9 18 9H17ZM9 7C9 5.34315 10.3431 4 12 4C13.6569 4 15 5.34315 15 7V9H9V7Z" fill="#5C3E1F" />
                <path d="M12 14C10.8954 14 10 14.8954 10 16C10 17.1046 10.8954 18 12 18C13.1046 18 14 17.1046 14 16C14 14.8954 13.1046 14 12 14Z" fill="#E8C87A" />
            </svg>
        </button>
        <div id="adminPanel" class="info-panel">
            <div class="info-title">🗝️ Панель управления</div>
             <div class="btn-group">
                <button class="btn" id="addDayBtn">➕ Добавить день</button>
            </div>
            <button id="enableEditBtn" class="edit-btn success">✏️ Включить режим редактирования</button>
            <button id="disableEditBtn" class="edit-btn danger" style="display:none">🔒 Выключить режим</button>
            <button id="saveDataBtn" class="edit-btn">💾 Сохранить изменения в облако</button>
            <div id="editModeStatus" class="edit-status">⚙️ Режим редактирования: ВЫКЛ</div>
            <div id="syncStatus" class="sync-status"></div>
        </div>
    </div>
</div>

<div id="passwordModal" class="modal-password">
    <div class="modal-password-card">
        <h3>🔒 Введите пароль</h3>
        <input type="password" id="passwordInput" class="password-input" placeholder="Введите пароль">
        <div class="modal-buttons">
            <button id="submitPassword" class="modal-btn primary">Открыть</button>
            <button id="closePasswordModal" class="modal-btn secondary">Отмена</button>
        </div>
        <div id="passwordError" style="color:red; margin-top:10px"></div>
    </div>
</div>

<!-- Модалка для плиток (в зависимости от режима) -->
<div class="modal-overlay" id="dayModal">
    <div class="modal-card">
        <h3 id="modalTitle">📅 Добавить / Редактировать день-плитку</h3>
        <div id="modalBodyContent"></div>
        <div class="modal-actions" id="modalActions"></div>
    </div>
</div>

<div class="report-modal-overlay" id="reportModal">
    <div class="report-modal-card">
        <button class="report-close-btn" id="reportCloseBtn">✕</button>
        <h3>📄 Отчет</h3>
        <div class="report-date" id="reportDate">—</div>
        <div class="report-content" id="reportContent">—</div>
    </div>
</div>

<script>
    (function() {   
        const BASE_SERVICE_KEYS = ["Ведущий", "Чайханщик", "Уборщик"];
        const OTHER_SERVICE_KEYS = [
            "Закупщик", "Спикерхантер", "ПБУ", "ПГО", "ПСО", "Литком", 
            "КАЗНАЧЕй", "ПРЕДСЕДАТЕЛь", "замПГО", "РС", "Водовоз", "Админ сайта"
        ];
        const DAYS = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"];

        let servicesData = {};
        let dayTiles = [];
        let notices = [];
        let isUnlocked = false;
        let currentEditTileIndex = -1; 
        
        // Состояние открытых родительских кнопок
        let openParents = {};

        // Функция для получения полного списка всех ключей строк
        function getAllServiceKeys() {
            let list = [];
            BASE_SERVICE_KEYS.forEach(role => {
                DAYS.forEach(day => {
                    list.push(`${role} ${day}`);
                });
            });
            list = list.concat(OTHER_SERVICE_KEYS);
            return list;
        }

        function loadLocalData() {
            try {
                const s = localStorage.getItem('mir_thursday_services');
                if (s) servicesData = JSON.parse(s);
                const t = localStorage.getItem('mir_thursday_tiles');
                if (t) dayTiles = JSON.parse(t);
                const n = localStorage.getItem('mir_thursday_notices');
                if (n) notices = JSON.parse(n);
            } catch(e) {}
        }
        function saveLocalData() {
            localStorage.setItem('mir_thursday_services', JSON.stringify(servicesData));
            localStorage.setItem('mir_thursday_tiles', JSON.stringify(dayTiles));
            localStorage.setItem('mir_thursday_notices', JSON.stringify(notices));
        }

        function getThursdays() {
            const now = new Date();
            let startDate = new Date(2026, 7, 6); 
            while (startDate.getDay() !== 4) startDate.setDate(startDate.getDate() + 1);

            const results = []; let current = new Date(startDate);
            const oneMonthAgo = new Date(now); oneMonthAgo.setDate(oneMonthAgo.getDate() - 30);
            const endDate = new Date(now.getFullYear() + 5, 11, 31);

            while (current <= endDate) {
                const y = current.getFullYear(); const m = String(current.getMonth() + 1).padStart(2, '0');
                const day = String(current.getDate()).padStart(2, '0');
                results.push({ dateObj: new Date(current), label: `${day}.${m}`, full: `${y}-${m}-${day}` });
                current.setDate(current.getDate() + 7);
            }
            return results.filter(t => t.dateObj >= oneMonthAgo);
        }

        function renderTable() {
            const thead = document.getElementById('tableHead');
            const tbody = document.getElementById('tableBody');
            const thursdays = getThursdays();
            const allKeys = getAllServiceKeys();

            if (thursdays.length === 0) {
                thead.innerHTML = '<tr><th>Служение</th></tr>';
                tbody.innerHTML = '<tr><td colspan="2" style="text-align:center; padding:20px; color:#888;">Нет актуальных четвергов</td></tr>';
                return;
            }

            let headerRow = '<tr><th>Служение</th>';
            thursdays.forEach(t => { headerRow += `<th class="th-date">${t.label}<small>чт</small></th>`; });
            headerRow += '</tr>';
            thead.innerHTML = headerRow;

            let bodyHtml = '';
            
            allKeys.forEach(key => {
                // Проверяем, является ли эта строка "родительской" и нужно ли её скрывать/показывать
                let isHidden = false;
                let isParent = false;
                let parentRole = "";

                // Если это одна из наших трех должностей, проверяем день
                if (BASE_SERVICE_KEYS.some(r => key.startsWith(r + " "))) {
                    const parts = key.split(" ");
                    const role = parts[0];
                    const day = parts[1];

                    if (day === "Пн") {
                        isParent = true;
                        parentRole = role;
                    } else {
                        // Это Вт, Ср, Чт... Проверяем, открыт ли родитель
                        if (!openParents[role]) {
                            isHidden = true; // Скрываем, если родитель не открыт
                        }
                    }
                }

                // Определяем класс для строки
                let rowClass = "";
                if (isParent) {
                    rowClass = 'clickable-header'; // Кликабельная строка-заголовок
                } else if (!BASE_SERVICE_KEYS.some(r => key.startsWith(r + " "))) {
                    // Обычная строка (Закупщик и т.д.) - без класса
                    rowClass = "";
                } else {
                    // Это скрываемые дни (Вт, Ср...)
                    if (isHidden) {
                        rowClass = 'sub-row'; // Скрыты по умолчанию
                    } else {
                        rowClass = 'sub-row visible'; // Показаны, если родитель открыт
                    }
                }

                // Отрисовка строки
                bodyHtml += `<tr class="${rowClass}" data-role="${isParent ? key : ''}"><td ${isParent ? 'class="clickable-header"' : ''}>${key}</td>`;

                thursdays.forEach(t => {
                    const full = t.full;
                    let value = servicesData[key]?.[full] || '—';
                    let isFree = (value === '—');
                    const cls = isFree ? 'cell-free' : 'cell-occupied';

                    if (isUnlocked) {
                        bodyHtml += `<td>
                            <select class="edit-cell-select" data-role="${key}" data-date="${full}">
                                <option value="—" ${value === '—' ? 'selected' : ''}>—</option>
                                <option value="П" ${value === 'П' ? 'selected' : ''}>П (Присутствовал)</option>
                                <option value="О" ${value === 'О' ? 'selected' : ''}>О (Отсутствовал)</option>
                                <option value="У" ${value === 'У' ? 'selected' : ''}>У (Уважительная)</option>
                            </select>
                        </td>`;
                    } else {
                        let displayValue = value;
                        let extraClass = '';
                        if (value === 'П') { displayValue = '✅ П'; extraClass = 'status-P'; }
                        else if (value === 'О') { displayValue = '❌ О'; extraClass = 'status-O'; }
                        else if (value === 'У') { displayValue = '⚠️ У'; extraClass = 'status-U'; }
                        
                        if (isFree) {
                            bodyHtml += `<td><span class="cell-free">${displayValue}</span></td>`;
                        } else {
                            bodyHtml += `<td><span class="${extraClass}">${displayValue}</span></td>`;
                        }
                    }
                });
                bodyHtml += '</tr>';
            });
            tbody.innerHTML = bodyHtml;

            // Обработчики для селектов в режиме редактирования
            document.querySelectorAll('.edit-cell-select').forEach(select => {
                select.addEventListener('change', function() {
                    const role = this.dataset.role;
                    const date = this.dataset.date;
                    const value = this.value;
                    if (!servicesData[role]) servicesData[role] = {};
                    servicesData[role][date] = value;
                    saveLocalData();
                });
            });

            // Обработчики кликов по родительским заголовкам (Ведущий Пн и т.д.)
            document.querySelectorAll('tr.clickable-header td:first-child').forEach(td => {
                td.addEventListener('click', function() {
                    const roleText = this.innerText.trim(); // "Ведущий Пн"
                    const roleName = roleText.split(" ")[0]; // "Ведущий"
                    
                    // Переключаем состояние открытия
                    openParents[roleName] = !openParents[roleName];
                    
                    // Перерисовываем таблицу
                    renderTable(); 
                });
            });
            
            setTimeout(() => {
                const wrap = document.getElementById('tableWrap');
                const ths = wrap.querySelectorAll('thead th');
                let idx = -1;
                ths.forEach((th, i) => { if(th.innerText.includes('30.09')) idx = i; });
                if(idx !== -1 && wrap.querySelector('tbody tr')) {
                    const cell = wrap.querySelector('tbody tr').querySelectorAll('td')[idx];
                    if(cell) wrap.scrollLeft = cell.offsetLeft + cell.offsetWidth - wrap.clientWidth + 50;
                }
            }, 100);
        }

        function renderDayTiles() {
            const container = document.getElementById('dayTilesContainer');
            if (!dayTiles.length) {
                container.innerHTML = `<div style="color:#888; text-align:center; width:100%; padding:20px;">Нет добавленных дней</div>`;
                return;
            }
            let html = '';
            dayTiles.forEach((item, index) => {
                html += `
                    <div class="day-tile" data-index="${index}">
                        <span>${item.date || '—'}</span>
                        <span class="small-date">отчет</span>
                    </div>
                `;
            });
            container.innerHTML = html;
            container.querySelectorAll('.day-tile').forEach(tile => {
                tile.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.index);
                    if (!isNaN(idx) && dayTiles[idx]) {
                        openEditTileModal(idx);
                    }
                });
            });
        }

        function renderNotices() {
            const container = document.getElementById('noticeList');
            if (!notices.length) {
                container.innerHTML = `<div class="empty-notice"></div>`;
                return;
            }
            let html = '';
            notices.forEach((item, index) => {
                html += `
                    <div class="notice-item">
                        <span class="notice-date">${item.date || '—'}</span>
                        <span class="notice-text">${item.text || ''}</span>
                        <span class="notice-del" data-index="${index}">✖ удалить</span>
                    </div>
                `;
            });
            container.innerHTML = html;
            container.querySelectorAll('.notice-del').forEach(btn => {
                btn.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.index, 10);
                    if (!isNaN(idx) && idx >= 0 && idx < notices.length) {
                        notices.splice(idx, 1);
                        saveLocalData();
                        renderNotices();
                    }
                });
            });
        }

        function refreshAll() {
            loadLocalData();
            renderTable();
            renderDayTiles();
            renderNotices();
        }

        function showToast(message, isError = false) {
            let toast = document.getElementById('toastMsg');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'toastMsg';
                toast.style.cssText = 'position:fixed; bottom:100px; left:50%; transform:translateX(-50%); background:#333; color:#ffd966; padding:12px 24px; border-radius:40px; z-index:99999; border:2px solid #ffd966; font-size:14px; white-space:nowrap;';
                document.body.appendChild(toast);
            }
            toast.style.background = isError ? '#8B0000' : '#1e7a4a';
            toast.innerText = message;
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 3000);
        }

        function showLoading(show) {
            let overlay = document.getElementById('loadingOverlay');
            if (!overlay) {
                overlay = document.createElement('div');
                overlay.id = 'loadingOverlay';
                overlay.style.cssText = 'position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); display:none; justify-content:center; align-items:center; z-index:50000;';
                overlay.innerHTML = '<div class="spinner" style="width:50px;height:50px;border:5px solid #ffd966;border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite;"></div>';
                const style = document.createElement('style');
                style.textContent = '@keyframes spin { to { transform: rotate(360deg); } }';
                document.head.appendChild(style);
                document.body.appendChild(overlay);
            }
            overlay.classList.toggle('active', show);
        }

        function loadFromCloud() {
            showLoading(true);
            const callbackName = 'jsonp_callback_' + Date.now();
            window[callbackName] = function (data) {
                delete window[callbackName];
                if (document.body.contains(script)) document.body.removeChild(script);
                if (data && data.thursday_data) {
                    const d = data.thursday_data;
                    if (d.services) servicesData = d.services;
                    if (d.dayTiles) dayTiles = d.dayTiles;
                    if (d.notices) notices = d.notices;
                    saveLocalData();
                    showToast('✅ Данные четвергов загружены из облака');
                } else {
                    showToast('ℹ️ В облаке нет данных по четвергам (используется локальное)', true);
                }
                showLoading(false);
                refreshAll();
            };
            const script = document.createElement('script');
            script.src = `${SCRIPT_URL}?callback=${callbackName}`;
            script.onerror = function () {
                delete window[callbackName];
                if (document.body.contains(script)) document.body.removeChild(script);
                showToast('⚠️ Не удалось загрузить из облака, используются локальные данные', true);
                showLoading(false);
                refreshAll();
            };
            document.body.appendChild(script);
        }

        function saveToCloud() {
            showLoading(true);
            const saveData = {
                type: 'thursday_data',
                thursday_data: {
                    services: servicesData,
                    dayTiles: dayTiles,
                    notices: notices
                }
            };
            
            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify(saveData),
                headers: { 'Content-Type': 'application/json' }
            }).then(() => {
                saveLocalData();
                showLoading(false);
                showToast('✅ Данные четвергов сохранены в облако!');
            }).catch(() => {
                saveLocalData();
                showLoading(false);
                showToast('❌ Ошибка отправки, данные сохранены локально', true);
            });
        }

        function setupAdminPanel() {
            const lockBtn = document.getElementById('lockBtn');
            const modal = document.getElementById('passwordModal');
            const submitBtn = document.getElementById('submitPassword');
            const closeBtn = document.getElementById('closePasswordModal');
            const passwordInput = document.getElementById('passwordInput');
            const errorDiv = document.getElementById('passwordError');
            const adminPanel = document.getElementById('adminPanel');

            function openModal() { modal.classList.add('active'); passwordInput.value = ''; errorDiv.innerHTML = ''; passwordInput.focus(); }
            function closeModal() { modal.classList.remove('active'); }
            function checkPassword() {
                if (passwordInput.value === ADMIN_PASSWORD) {
                    closeModal();
                    adminPanel.classList.add('visible');
                    showToast('🔓 Добро пожаловать!');
                } else {
                    errorDiv.innerHTML = '❌ Неверный пароль!';
                    passwordInput.value = '';
                    passwordInput.focus();
                }
            }
            lockBtn.onclick = openModal;
            submitBtn.onclick = checkPassword;
            closeBtn.onclick = closeModal;
            passwordInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') checkPassword(); });
            modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

            document.getElementById('enableEditBtn').onclick = function() {
                isUnlocked = true;
                document.getElementById('enableEditBtn').style.display = 'none';
                document.getElementById('disableEditBtn').style.display = 'inline-block';
                document.getElementById('editModeStatus').innerHTML = '✏️ Режим редактирования: ВКЛЮЧЕН';
                renderTable();
                showToast('✏️ Режим редактирования включен! Выберите П/О/У в ячейках');
            };
            document.getElementById('disableEditBtn').onclick = function() {
                isUnlocked = false;
                document.getElementById('enableEditBtn').style.display = 'inline-block';
                document.getElementById('disableEditBtn').style.display = 'none';
                document.getElementById('editModeStatus').innerHTML = '⚙️ Режим редактирования: ВЫКЛ';
                renderTable();
                showToast('🔒 Режим редактирования выключен');
            };
            document.getElementById('saveDataBtn').onclick = function() {
                saveToCloud();
            };
        }

        function setupModals() {
            const modal = document.getElementById('dayModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalBody = document.getElementById('modalBodyContent');
            const modalActions = document.getElementById('modalActions');
            const addDayBtn = document.getElementById('addDayBtn');

            // Обработчик открытия формы добавления новой плитки
            addDayBtn.addEventListener('click', function() {
                currentEditTileIndex = -1;
                openEditModal(false);
            });

            // Универсальная функция открытия модалки
            function openEditModal(isEdit) {
                modal.classList.add('active');

                if (isEdit) {
                    // === РЕЖИМ РЕДАКТИРОВАНИЯ СУЩЕСТВУЮЩЕЙ ===
                    const data = dayTiles[currentEditTileIndex];
                    modalTitle.innerText = '✏️ Редактировать день-плитку';
                    modalBody.innerHTML = `
                        <label for="modalDayInput" style="color:#ffdd99; font-weight:600; display:block; margin-top:10px; margin-bottom:4px;">Дата</label>
                        <input type="text" id="modalDayInput" value="${data.date || ''}" style="width:100%; padding:12px 16px; background:#0f1a24; border:2px solid #4a6a8a; border-radius:16px; color:#fff; font-size:15px;" />
                        <label for="modalTextInput" style="color:#ffdd99; font-weight:600; display:block; margin-top:10px; margin-bottom:4px;">Текст отчета</label>
                        <textarea id="modalTextInput" style="width:100%; min-height:100px; padding:12px 16px; background:#0f1a24; border:2px solid #4a6a8a; border-radius:16px; color:#fff; font-size:15px; resize:vertical;">${data.report || ''}</textarea>
                    `;
                    modalActions.innerHTML = `
                        <button class="btn btn-cancel" id="modalCancelBtn">Отмена</button>
                        <button class="btn" id="modalSaveBtn">💾 Сохранить</button>
                    `;
                } else {
                    // === РЕЖИМ ДОБАВЛЕНИЯ НОВОЙ ===
                    modalTitle.innerText = '📅 Добавить день-плитку';
                    modalBody.innerHTML = `
                        <label for="modalDayInput" style="color:#ffdd99; font-weight:600; display:block; margin-top:10px; margin-bottom:4px;">Дата</label>
                        <input type="text" id="modalDayInput" value="" placeholder="например: четверг 12.09" style="width:100%; padding:12px 16px; background:#0f1a24; border:2px solid #4a6a8a; border-radius:16px; color:#fff; font-size:15px;" />
                        <label for="modalTextInput" style="color:#ffdd99; font-weight:600; display:block; margin-top:10px; margin-bottom:4px;">Текст отчета</label>
                        <textarea id="modalTextInput" style="width:100%; min-height:100px; padding:12px 16px; background:#0f1a24; border:2px solid #4a6a8a; border-radius:16px; color:#fff; font-size:15px; resize:vertical;" placeholder="Подробности, отчет..."></textarea>
                    `;
                    modalActions.innerHTML = `
                        <button class="btn btn-cancel" id="modalCancelBtn">Отмена</button>
                        <button class="btn" id="modalSaveBtn">💾 Сохранить</button>
                    `;
                }

                // Обработчики кнопок внутри открытой модалки
                document.getElementById('modalCancelBtn').addEventListener('click', () => modal.classList.remove('active'));
                document.getElementById('modalSaveBtn').addEventListener('click', function() {
                    const dateInput = document.getElementById('modalDayInput').value.trim();
                    const textInput = document.getElementById('modalTextInput').value.trim();
                    if (!dateInput) { alert('Введите дату'); return; }
                    if (!textInput) { alert('Введите текст отчета'); return; }

                    if (currentEditTileIndex !== -1) {
                        // Сохранение существующего
                        dayTiles[currentEditTileIndex].date = dateInput;
                        dayTiles[currentEditTileIndex].report = textInput;
                        showToast('✅ Заметка обновлена!');
                    } else {
                        // Сохранение нового
                        dayTiles.push({ date: dateInput, report: textInput });
                        showToast('✅ Заметка добавлена!');
                    }
                    
                    saveLocalData();
                    renderDayTiles();
                    modal.classList.remove('active');
                });
            }

            // Функция, вызываемая при клике на существующую плитку
            window.openEditTileModal = function(index) {
                currentEditTileIndex = index;
                
                if (isUnlocked) {
                    // Если режим редактирования включен — открываем редактор
                    openEditModal(true);
                } else {
                    // Если режим ВЫКЛ — открываем просмотр
                    const data = dayTiles[index];
                    modalTitle.innerText = '📄 Просмотр отчета';
                    modalBody.innerHTML = `
                        <div style="color:#ffd966; font-weight:bold; text-align:center; margin-bottom:15px;">${data.date || '—'}</div>
                        <div style="color:#e8e8e8; line-height:1.6; white-space:pre-wrap; background:rgba(0,0,0,0.3); padding:16px; border-radius:12px; border-left:4px solid #ffd966;">${data.report || 'Нет текста'}</div>
                    `;
                    modalActions.innerHTML = `
                        <button class="btn btn-cancel" id="modalCancelBtn">Закрыть</button>
                    `;
                    modal.classList.add('active');

                    document.getElementById('modalCancelBtn').addEventListener('click', () => modal.classList.remove('active'));
                }
            };

            // Закрытие по клику на фон
            modal.addEventListener('click', function(e) {
                if (e.target === modal) modal.classList.remove('active');
            });
        }

        loadLocalData(); 
        refreshAll();    
        setupAdminPanel();
        setupModals();
        loadFromCloud(); 
    })();
</script>
<script src="on.js"></script>
</body>
</html>
